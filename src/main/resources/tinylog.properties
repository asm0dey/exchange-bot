# ============================================================================
# NO PERSONAL INFORMATION IN LOGS. EVER.
#
# This bot encrypts identities at rest in two layers because the data is
# sensitive. A log line that writes the same identities in plaintext defeats
# the encryption: a previous review found the Telegram framework logging the
# WHOLE update JSON (chat id, user id, first/last name, username, message
# text) at WARN/ERROR, landing in stderr and the container log unfiltered,
# right next to a database that goes to great lengths to seal the same data.
#
# Before adding a log line, ask: could this value identify a person or a
# chat, even loosely? If yes, don't log it. Specifically, NEVER log:
#   - user ids, usernames, or display names
#   - chat ids
#   - message text, amounts, or any other payload content
#   - currencies tied to a specific chat/request (a bare currency code
#     standing alone, e.g. a rate feed's base currency, is not identifying —
#     it's one of a small fixed ISO 4217 set, not tied to any person or chat)
#   - ref_token / short_id values, or chat_ref / user_ref (Crypto.ref(...))
#     — these are pseudonymous, but they are STABLE per person/chat, so they
#     are identifiers too, just ones that currently need the encrypted DB to
#     reverse. Don't log them, and don't use them as a correlation id either.
#   - an exception's .message, or any cause's .message — see the comment on
#     the listener's catch block in Main.kt: a rejected-token failure is a
#     ClientRequestException whose message embeds the full request URL,
#     which contains the bot token. Exception CLASS names are fine and are
#     usually enough to diagnose from.
#
# What's safe and worth logging: counts, outcome categories (a fixed label
# describing what happened, not the data that produced it), a bare currency
# code as above, exception class names, and — if you need to correlate log
# lines from one request — a freshly generated random id that is NOT derived
# from any user value (chat_ref/user_ref/ref_token included), so it can never
# be reversed back to who triggered it.
# ============================================================================

level = info

# Vendeli's telegram-bot-jvm 9.6.0 logs identifying data — and, in one case,
# framework chatter that isn't PII but is still noise — from FIVE real
# packages, not the two the previous (slf4j-simple) config named:
#
#   eu.vendeli.tgbot.core.interceptors
#     DefaultInvokeInterceptor logs the WHOLE update JSON (chat id, user id,
#     names, username, message text) at WARN for an unhandled update and at
#     ERROR (with stack trace) when a handler throws. DefaultPreInvokeInterceptor
#     and DefaultValidationInterceptor log the raw Telegram user id at DEBUG.
#     DefaultValidationInterceptor and DefaultSetupInterceptor also call the
#     library's inline checkIsLimited(), which logs the raw user id at INFO
#     when a rate limit trips — being `inline`, that call compiles directly
#     into these two classes' own bytecode, confirmed by grepping the
#     compiled .class files for the log's string literal.
#   eu.vendeli.tgbot.interfaces.action
#     TgAction.doRequest/doRequestReturning call the library's `internal
#     suspend inline` makeSilentRequest/makeRequestReturning (declared in
#     eu.vendeli.tgbot.utils.internal.BotRequestExtensions.kt), which log
#     outgoing request content — the same identifying payload as above — at
#     ERROR on any failed send. Being `inline`, that call compiles directly
#     into TgAction's own bytecode (its only caller), NOT into the declaring
#     BotRequestExtensionsKt class. This was the escape a previous version of
#     this file missed: it suppressed eu.vendeli.tgbot.utils.internal (where
#     the source line lives) instead of eu.vendeli.tgbot.interfaces.action
#     (where it actually runs), so the real runtime log line —
#     `eu.vendeli.tgbot.interfaces.action.TgAction: Request - ...` — went
#     through unfiltered. Confirmed by grepping the compiled 9.6.0 jar with
#     `strings` for the log literal: it appears in TgAction.class (the real
#     caller) in addition to BotRequestExtensionsKt.class (the declaring
#     copy every inline function keeps around, dead at runtime for real call
#     sites but indistinguishable from a live one in a naive class-file scan
#     — see docs/logging-notes.md).
#   eu.vendeli.tgbot.utils.internal
#     Kept: eu.vendeli.tgbot.utils.internal.BotUtilsKt.setupSessionManager
#     (a regular, non-inline top-level fun in this package) logs a DEBUG
#     "Initializing session manager" line — no PII, but harmless to keep
#     silenced. Does NOT cover the ERROR log above; see the
#     interfaces.action entry.
#   eu.vendeli.tgbot.utils.common
#     BotUtils.jvm.kt's loadContext logs the command/handler routing table at
#     INFO on every TelegramBot construction ("Loaded context, current
#     registry:") — not personal data, but framework chatter that must not
#     reappear as a "new noise" regression versus the old config, which
#     silenced it as a side effect of matching this logger's registered NAME
#     (see below).
#   eu.vendeli.tgbot.implementations
#     DefaultSession (a private class in DefaultSessionManager.kt — NOT
#     DefaultSessionManager itself, which is a different class in the same
#     file and does not log) logs chat id at WARN/ERROR when a tracked
#     session's messages fail to delete. This bot never touches vendeli's
#     Session API, so today this is dead code — suppressed anyway because the
#     session subsystem is "always-on" per the library's own doc comment, and
#     reachability could change without anyone re-auditing the framework.
#
# Every one of the above is a REAL PACKAGE, confirmed by extracting the
# actual eu.vendeli:telegram-bot-jvm:9.6.0.jar class files and grepping their
# bytecode for each log call's string literal (`strings *.class`), AND by
# compiling stand-in classes with the same object/suspend/inline/extension-
# function shape in these exact packages and confirming tinylog drops them
# while an unrelated INFO probe line still prints, AND confirming a typo'd
# package name lets the same lines back through. See docs/logging-notes.md
# for the full method — including the DefaultSession/DefaultSessionManager
# mix-up AND the utils.internal/interfaces.action mix-up, both caught only by
# checking the compiled bytecode, which is exactly the class of mistake this
# whole exercise is here to prevent.
#
# General rule for every entry above: for a NON-inline function, the log call
# runs in the class it's textually declared in — suppress that package. For
# an `inline` function, the log call runs in the CALLER's class instead
# (found by finding every call site in the library's sources and confirming
# via the compiled jar which class actually carries the literal at runtime;
# a stand-in class in the declaring package proves nothing) — suppress the
# caller's package, not the declaring one. A stand-in/probe class built in
# the declaring package can pass even when the real rule is wrong, because it
# never reproduces the inline-into-caller compilation step; only reading the
# real library's compiled classes (or its actual runtime call sites) proves
# where the bytecode really lands.
#
# This is deliberately NOT the SLF4J logger NAME the library registers these
# loggers under (a different, often hand-picked string per call site — see
# BotRequestExtensions.kt / DefaultInvokeInterceptor.kt, and the git history
# of this file for the slf4j-simple config that keyed on those strings).
# tinylog does not filter by SLF4J logger name at all: `level@...` matches
# the REAL calling class, found by walking the JVM stack trace at the log
# call site. Porting the old logger-name strings here verbatim would
# compile, look plausible, and silently suppress nothing — the exact bug
# class that put PII in the log in the first place. Package-level (not
# precise-class) targeting is deliberate too: an early draft of this file
# named eu.vendeli.tgbot.implementations.DefaultSessionManager instead of
# .DefaultSession, and it silently suppressed nothing — caught only because
# every rule here is empirically tested, not because the mistake was obvious.
level@eu.vendeli.tgbot.core.interceptors = off
level@eu.vendeli.tgbot.interfaces.action = off
level@eu.vendeli.tgbot.utils.internal = off
level@eu.vendeli.tgbot.utils.common = off
level@eu.vendeli.tgbot.implementations = off

writer = console
writer.format = {date: yyyy-MM-dd HH:mm:ss} [{level}] {class}: {message}
