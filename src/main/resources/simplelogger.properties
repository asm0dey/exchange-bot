# slf4j-simple ships with no config file by default and its default threshold is
# INFO, so without this file two vendeli internals write plaintext chat/user
# identities (from ordinary DM/@mention/reply traffic) to stderr — the same
# identities the encrypted-at-rest schema is built to seal:
#
# - eu.vendeli.core.interceptors.InvokeInterceptor logs the WHOLE update JSON at
#   WARN for any update matching no handler, and at ERROR (with stack trace) when
#   a handler throws. Verified in telegram-bot-jvm 9.6.0 sources,
#   DefaultInvokeInterceptor.kt: `loggerFactory.get("eu.vendeli.core.interceptors.InvokeInterceptor")`,
#   then `logger.warn("update: ${context.update.toJsonString()} not handled.")`
#   and `logger.error("Invocation error ... with update: ${context.update.toJsonString()}", it)`.
#   Note the logger's registered name drops both the "tgbot" package segment and
#   the "Default" prefix the class itself carries — the literal string above is
#   what SimpleLogger actually keys on, not the FQN you'd get from the class name.
#
# - eu.vendeli.tgbot.TelegramBot logs outgoing request content at ERROR whenever
#   a send fails. Verified in the same sources jar,
#   BotRequestExtensions.kt (both makeRequestReturning and makeSilentRequest):
#   `config.loggerFactory.get("eu.vendeli.tgbot.TelegramBot")` then
#   `logger.error("Request - ${...request.content} received failure response: ...")`.
#   This is the same name TelegramBot.kt uses for its own logger
#   (`loggerFactory.get(this::class.fqName)`), so silencing it also drops that
#   class's one benign DEBUG line — no loss, DEBUG is already below the default
#   INFO threshold.
#
# Every other interceptor that logs identifying data (PreInvokeInterceptor,
# ValidationInterceptor) only does so at DEBUG, already below the default INFO
# threshold, so it is not reachable here and is left alone.
org.slf4j.simpleLogger.log.eu.vendeli.core.interceptors.InvokeInterceptor=off
org.slf4j.simpleLogger.log.eu.vendeli.tgbot.TelegramBot=off
