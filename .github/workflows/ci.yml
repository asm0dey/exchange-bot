name: Gradle CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test with Gradle
        run: ./gradlew build

      # `./gradlew build` above already built the web app, ran its unit tests
      # (webTest), and installed web/node_modules (bunInstall) — so the Playwright
      # CLI is right there at web/node_modules/.bin/playwright. install-deps installs
      # the OS libraries Chromium needs (apt-get, via sudo; ubuntu-latest runners have
      # passwordless sudo); the e2e script (web/package.json) does `playwright install
      # chromium` itself, so the browser binary doesn't need a separate step here.
      - name: Web end-to-end
        run: web/node_modules/.bin/playwright install-deps chromium && ./gradlew webE2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 5

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: build/test-results/
          retention-days: 5
