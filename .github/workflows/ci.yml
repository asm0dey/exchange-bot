name: Gradle CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test with Gradle
        run: ./gradlew build

      # `./gradlew build` above already built the web app, ran its unit tests
      # (webTest), and installed web/node_modules (bunInstall). webE2e itself now
      # runs Playwright inside the pinned mcr.microsoft.com/playwright container
      # (see build.gradle.kts) instead of on the runner's bare Chromium/fonts, so no
      # separate `playwright install-deps` step is needed — the image ships its own
      # browsers and OS libraries, and this is the same command a developer runs
      # locally, so CI and local screenshots render identical pixels.
      - name: Web end-to-end
        run: ./gradlew webE2e

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 5

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: build/test-results/
          retention-days: 5
