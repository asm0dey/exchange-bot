name: release

# Releases are integers. Tag v1, v2, ... — the tag drives everything below:
# the jar version, the GitHub Release, and the image tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the Release and upload the jar
  packages: write   # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Liberica = BellSoft, matching the toolchain vendor pin in build.gradle.kts.
      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew test shadowJar
        env:
          VERSION: ${{ steps.version.outputs.number }}

      - run: gh release create "$GITHUB_REF_NAME" "build/libs/exchange-bot-${VERSION}.jar" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
            ghcr.io/${{ github.repository }}:latest
