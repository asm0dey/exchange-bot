name: release

# Releases are integers. Tag v1, v2, ... — the tag drives everything below:
# the jar version, the GitHub Release, and the image tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the Release and upload the jar
  packages: write   # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Liberica = BellSoft, matching the toolchain vendor pin in build.gradle.kts.
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test shadowJar
        env:
          VERSION: ${{ steps.version.outputs.number }}

      # build/release/, not build/libs/ — see the shadowJar block in build.gradle.kts.
      - run: gh release create "$GITHUB_REF_NAME" "build/release/exchange-bot-${VERSION}.jar" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # `docker/build-push-action`'s `cache-from`/`cache-to: type=gha` below only persists
      # BuildKit's *layer* cache across runs — the `RUN --mount=type=cache` mounts in
      # Dockerfile (Gradle home, npm cache, Bun cache) live in BuildKit's separate cache-mount
      # store, which `type=gha` does not touch. buildkit-cache-dance bridges that: it copies
      # each mount's content into a plain directory before the build (so actions/cache below
      # can persist it) and back out after (so the next run's mounts start warm). `cache-dir` +
      # `dockerfile` (rather than a hand-written `cache-map`) auto-discovers every
      # `--mount=type=cache,target=...` in Dockerfile, so a future cache mount added there
      # doesn't also need a matching edit here.
      - name: Cache Docker build mounts
        uses: actions/cache@v4
        id: docker-build-cache
        with:
          path: cache-mount
          key: docker-build-cache-${{ hashFiles('build.gradle.kts', 'gradle/libs.versions.toml', 'web/bun.lock', 'web/tools/package-lock.json') }}
          restore-keys: |
            docker-build-cache-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.docker-build-cache.outputs.cache-hit }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
            ghcr.io/${{ github.repository }}:latest
